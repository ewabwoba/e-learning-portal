spring:
  application:
    name: coursely-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/coursely?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:update}   # use "validate" with Flyway migrations in production
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
server:
  port: 8080
coursely:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  jwt:
    # Development-only default. Set JWT_SECRET (32+ random characters) in every real environment.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  admin:
    # Creates the first admin on startup if none exists. Leave empty to skip. Password must be 12+ characters.
    email: ${COURSELY_ADMIN_EMAIL:}
    password: ${COURSELY_ADMIN_PASSWORD:}
    name: ${COURSELY_ADMIN_NAME:Platform Admin}
  seed:
    enabled: ${COURSELY_SEED:true}   # demo data + demo accounts; set false outside local development
