services:
  mysql:
    image: mysql:8.4
    container_name: coursely-mysql
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: coursely
    ports: ["3306:3306"]
    volumes: ["coursely-db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  coursely-db:
